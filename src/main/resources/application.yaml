server:
  port: 8080

spring:
  application:
    name: spring-certification-lab

  datasource:
    url: jdbc:h2:mem:springlab
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  environment: default
  message: Default configuration loaded
  owner: Donato

logging:
  level:
    com.donatodev.springlab: INFO